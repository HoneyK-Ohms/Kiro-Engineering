body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.7 "IBM Plex Sans",system-ui,sans-serif}

p{margin:0 0 1em;max-width:70ch}a{color:var(--blue)}

:focus-visible{outline:3px solid #6fb0d6;outline-offset:3px}

header{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:72px}
.logo img{height:44px;width:auto;display:block}.logo{font:800 1.1rem Manrope;color:var(--navy);text-decoration:none}
nav ul{display:flex;gap:4px;list-style:none;margin:0;padding:0;align-items:center}
nav a,nav button{font:600 .95rem "IBM Plex Sans";color:var(--ink);background:none;border:0;padding:10px 14px;cursor:pointer;text-decoration:none;border-bottom:3px solid transparent}
nav a:hover,nav button:hover,nav [aria-current]{border-bottom-color:var(--blue)}
nav .cta{background:var(--blue);color:#fff;border:0;margin-left:8px}
nav li{position:relative}
.dd{position:absolute;top:100%;left:0;width:340px;background:#fff;border:1px solid var(--line);box-shadow:0 8px 24px rgba(16,31,48,.12);display:none;padding:6px 0}
.dd.open{display:block}.dd a{display:block;padding:10px 18px;border:0;font-weight:500}.dd a:hover{background:var(--bg)}
.burger{display:none}
@media(max-width:860px){.burger{display:block;border:1px solid var(--steel);background:none;padding:8px 14px;font:600 .95rem inherit}

.ph{background:#1b3248;overflow:hidden;position:relative}.ph img{width:100%;height:100%;object-fit:cover;display:block}

.hero .sl{position:absolute;inset:0;opacity:0;transition:opacity .9s}.hero .sl.on{opacity:1}.hero .sl img{width:100%;height:100%;object-fit:cover}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(16,31,48,.85),rgba(16,31,48,.35))}
.hero .wrap{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;justify-content:center}
.hero p{color:#dbe4ea;font-size:1.15rem}
.dots{position:absolute;z-index:3;bottom:20px;left:0;right:0}.dots .wrap{position:static;display:flex;gap:10px;align-items:center;flex-direction:row}
.dots button{width:36px;height:6px;border:0;background:#ffffff66;padding:0;cursor:pointer}.dots button[aria-current="true"]{background:#fff}
.dots span{margin-left:12px;font-size:.9rem}
.btn{display:inline-block;padding:14px 26px;font:600 .95rem Manrope;text-decoration:none;background:var(--blue);color:#fff;margin:0 12px 12px 0;border:2px solid var(--blue)}
.btn:hover{background:#1e5575}.btn.o{background:none;border-color:#fff}
section{padding:80px 0}@media(max-width:700px){section{padding:56px 0}}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}

const CH="Holy Trinity Ethiopian Church, Houston, Texas. Fully designed and detailed by Kiro Engineering (Architectural, Structural, MEP and Steel Detailing).";
const img=(s,alt)=>s=="structural-analysis-design"?`<img src="${LOC.church}" alt="3D model of Holy Trinity Ethiopian Church, Houston, Texas, designed and detailed by Kiro Engineering">`:`<img src="${B}content/${IM[s]}.jpg" alt="${alt}" loading="lazy" onerror="this.remove()">`;
const feat=(pic)=>`<aside class="feat">${pic?`<img src="${LOC.church}" alt="3D model of Holy Trinity Ethiopian Church, Houston, Texas">`:""}<div><h3>Featured project</h3><p>${CH}</p></div></aside>`;
const by=Object.fromEntries(S.map(x=>[x.s,x]));
const $=q=>document.querySelector(q),M=$("#main");
const lg=(f)=>`<img src="${B}${f}" alt="Kiro Engineering" onerror="this.replaceWith(Object.assign(document.createElement('span'),{textContent:'KIRO ENGINEERING'}))">`;
$("#lg").innerHTML=lg("logo.png");$("#fl").innerHTML=lg("logo-footer.png");
$("#dd").innerHTML=S.map(x=>`<a href="#/services/${x.s}">${x.n}</a>`).join("");
$("#fs").innerHTML=S.map(x=>`<a href="#/services/${x.s}">${x.n}</a>`).join("");
const tiles=()=>`<div class="grid">${S.map(x=>`<a class="tile" href="#/services/${x.s}"><div class="ph">${img(x.s,x.n)}</div><div class="b"><h3>${x.n}</h3><p>${x.t}</p><span class="go">View service &rarr;</span></div></a>`).join("")}</div>`;
const SL=[["slide1.jpg","structural-analysis-design"],["slide2.jpg","structural-demolition-modeling"],["slide3.jpg","steel-detailing-bim"]];
let ti,cur=0;
const home=()=>`<div class="hero">${SL.map((s,i)=>`<div class="sl${i?"":" on"}"><img src="${B+s[0]}" alt="" onerror="this.remove()"></div>`).join("")}<div class="wrap"><h1>Precision in design.<br>Confidence in construction.</h1><p>Multidisciplinary engineering for commercial, industrial, institutional and residential projects: structural, geotechnical, civil, environmental and construction management.</p><div><a class="btn" href="#/services">Explore our services</a><a class="btn o" href="#/contact">Discuss your project</a></div></div>
<div class="dots"><div class="wrap">${SL.map((s,i)=>`<button aria-label="Show slide ${i+1}" data-k="${i}"${i?"":' aria-current="true"'}></button>`).join("")}<span id="cap"></span></div></div></div>
<section><div class="wrap"><h2>Our services</h2><p>Select a discipline to see capabilities and technical detail.</p>${tiles()}</div></section>
<section class="dark"><div class="wrap two"><div><h2>About Kiro Engineering</h2><p>Founded in 2011, Kiro began as an individual engineer with a mission. Today it is a fully integrated organization providing discipline-based engineering and structural services from New York and New Jersey.</p><a class="btn" href="#/about">About the firm</a></div><div class="ph"><img src="${B}content/company-profile.jpg" alt="Kiro Engineering team and company profile" loading="lazy" onerror="this.remove()"></div></div></section>
<section><div class="wrap"><h2>Have a project in mind?</h2><p>Call (646) 558-1332 or email info@kiroengineering.com.</p><a class="btn" href="#/contact">Contact us</a></div></section>`;
function slides(){clearInterval(ti);const sl=document.querySelectorAll(".hero .sl"),ds=document.querySelectorAll(".dots button");if(!sl.length)return;
const go=k=>{cur=k;sl.forEach((e,i)=>e.classList.toggle("on",i==k));ds.forEach((d,i)=>d.setAttribute("aria-current",i==k));$("#cap").innerHTML=`<a href="#/services/${SL[k][1]}" style="color:#fff">${by[SL[k][1]].n}</a>`};
ds.forEach(d=>d.onclick=()=>go(+d.dataset.k));go(0);
if(!matchMedia("(prefers-reduced-motion:reduce)").matches)ti=setInterval(()=>go((cur+1)%SL.length),6000)}
const side=c=>`<nav class="side" aria-label="All services"><h2>All services</h2>${S.map(x=>`<a href="#/services/${x.s}"${x.s==c?" aria-current=\"page\"":""}>${x.n}</a>`).join("")}</nav>`;
const svc=x=>{const i=S.indexOf(x),p=S[(i+8)%9],n=S[(i+1)%9];return `<div class="bn"><div class="wrap bn-in"><div><p class="crumb"><a href="#/services">Services</a></p><h1>${x.n}</h1></div><div class="ph bi">${img(x.s,x.n)}</div></div></div>
<section><div class="wrap side-layout">${side(x.s)}<article><p style="font-size:1.15rem">${x.t}</p><h2>Overview</h2><p>${x.o}</p>${x.s=="steel-detailing-bim"?feat(1):x.s=="structural-analysis-design"?feat(0):""}<h2>Core capabilities</h2><div class="caps">${x.c.map(c=>`<div><h3>${c[0]}</h3><p>${c[1]}</p></div>`).join("")}</div><div class="det"><h2>Technical details</h2>${x.d.map(d=>`<h3>${d[0]}</h3><ul>${d[1].map(l=>`<li>${l}</li>`).join("")}</ul>`).join("")}<p style="color:var(--mute);font-size:.9rem;margin-top:1.5em">Standards and methods apply where appropriate to a given project.</p></div>
<h2 style="margin-top:1.6em">Related services</h2><p>${x.r.map(r=>`<a href="#/services/${r}">${by[r].n}</a>`).join(" &middot; ")}</p><div class="pn"><a class="btn" href="#/services/${p.s}">&larr; ${p.n}</a><a class="btn" href="#/services/${n.s}">${n.n} &rarr;</a></div></article></div></section>
<section class="dark"><div class="wrap"><h2>Have a project that requires specialized engineering?</h2><a class="btn" href="#/contact">Start a conversation</a></div></section>`};
const about=()=>`<section><div class="wrap two"><div><h1 style="font-size:clamp(2rem,4vw,3rem)">About Kiro Engineering</h1><p>Founded in 2011, Kiro began as an individual engineer with a mission. Today the company is a fully integrated organization providing discipline-based engineering and structural services. Diligence, integrity and excellence remain its guiding principles.</p><p>Leadership and staff are based in New York and New Jersey. Work covers structural and miscellaneous steel, shoring, drilled piles, caissons, foundations, soils and wetlands mitigation, demolition analysis, rebar detailing and construction project management, using 3D modeling and current project management practice.</p><a class="btn" href="#/services">View services</a></div><div class="stack"><div class="ph"><img src="${B}content/company-profile.jpg" alt="Kiro Engineering company profile" onerror="this.remove()"></div><img class="pt" src="${LOC.person}" alt="Kiro Engineering engineer in a hard hat and high-visibility jacket outdoors at sunset"></div></div></section>`;
const contact=()=>`<section><div class="wrap two" style="align-items:start"><div><h1 style="font-size:clamp(2rem,4vw,3rem)">Contact</h1><p>Find out what Kiro Engineering can do for you.</p><p>1202 Whitehorse Hamilton Road<br>Hamilton, NJ 08690<br>Phone: (646) 558-1332<br>Fax: (646) 558-1338<br><a href="mailto:info@kiroengineering.com">info@kiroengineering.com</a></p></div>
<form id="cf" novalidate>${[["name","Full name (required)","text"],["org","Company","text"],["email","Email (required)","email"],["phone","Phone","tel"]].map(f=>`<div><label for="${f[0]}">${f[1]}</label><input id="${f[0]}" type="${f[2]}"><span class="err" id="e-${f[0]}" role="alert"></span></div>`).join("")}<div><label for="svc">Service needed</label><select id="svc"><option value="">Select</option>${S.map(x=>`<option>${x.n}</option>`).join("")}</select></div><div><label for="loc">Project location</label><input id="loc"></div><div class="f"><label for="msg">Project description (required)</label><textarea id="msg" rows="5"></textarea><span class="err" id="e-msg" role="alert"></span></div><div class="f"><button class="btn" type="submit">Send inquiry</button><span id="ok" role="status"></span></div></form></div></section>`;
function route(){const p=location.hash.replace(/^#\/?/,"").split("/");let h,t="Kiro Engineering";
if(p[0]=="services"&&by[p[1]]){h=svc(by[p[1]]);t=by[p[1]].n+" | Kiro Engineering"}
else if(p[0]=="services"){h=`<section><div class="wrap"><h1 style="font-size:clamp(2rem,4vw,3rem)">Services</h1>${tiles()}</div></section>`;t="Services | Kiro Engineering"}
else if(p[0]=="about"){h=about();t="About | Kiro Engineering"}else if(p[0]=="contact"){h=contact();t="Contact | Kiro Engineering"}else h=home();
M.innerHTML=h;document.title=t;scrollTo(0,0);slides();
document.querySelectorAll("nav [data-r]").forEach(a=>a.toggleAttribute("aria-current",a.dataset.r==(p[0]||"home")));
$("#nv").classList.remove("open");$("#dd").classList.remove("open");
const f=$("#cf");if(f)f.onsubmit=e=>{e.preventDefault();let bad=0;[["name","Enter your name."],["email","Enter a valid email address."],["msg","Describe your project."]].forEach(([id,m])=>{const el=$("#"+id),ok=el.value.trim()&&(id!="email"||/^\S+@\S+\.\S+$/.test(el.value));$("#e-"+id).textContent=ok?"":m;bad+=!ok});if(bad)return;
const b=["Name: "+$("#name").value,"Company: "+$("#org").value,"Email: "+$("#email").value,"Phone: "+$("#phone").value,"Service: "+$("#svc").value,"Location: "+$("#loc").value,"","Project: "+$("#msg").value].join("\n");
location.href="mailto:info@kiroengineering.com?subject="+encodeURIComponent("Project inquiry")+"&body="+encodeURIComponent(b);$("#ok").textContent=" Opening your email app."}}
$("#sv").onclick=()=>{const o=$("#dd").classList.toggle("open");$("#sv").setAttribute("aria-expanded",o)};
$("#bg").onclick=()=>{const o=$("#nv").classList.toggle("open");$("#bg").setAttribute("aria-expanded",o)};
document.addEventListener("keydown",e=>{if(e.key=="Escape"){$("#dd").classList.remove("open");$("#nv").classList.remove("open")}});
document.addEventListener("click",e=>{if(!e.target.closest("#sv,#dd"))$("#dd").classList.remove("open")});
addEventListener("hashchange",route);route();
</script></body></html>
